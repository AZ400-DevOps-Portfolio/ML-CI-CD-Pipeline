# ci-cd.yml
# GitHub Actions CI/CD pipeline for the Iris ML Model API
#
# Pipeline jobs:
#   1. Test  — runs pytest on every push
#   2. Build — builds and pushes Docker image to Docker Hub

name: ML Model CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: iris-model-api

jobs:

# ─────────────────────────────────────────────
# JOB 1: CI — Run automated tests
# Blocks build if any test fails
# ─────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Train model (required for tests)
      run: python model/train.py

    - name: Run pytest
      run: pytest tests/ -v --tb=short

# ─────────────────────────────────────────────
# JOB 2: Build Docker image and push to Docker Hub
# Only runs if all tests pass
# ─────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}